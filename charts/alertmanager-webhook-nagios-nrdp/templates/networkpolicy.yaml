{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "alertmanager-webhook-nagios-nrdp.fullname" . }}
  labels:
    {{- include "alertmanager-webhook-nagios-nrdp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "alertmanager-webhook-nagios-nrdp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress.from | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
  {{- if .Values.networkPolicy.egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- end }}
{{- end }}
