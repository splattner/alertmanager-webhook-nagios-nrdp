name: PR Quality

on:
    pull_request:
        branches: [main]
    # Also verify main directly. Release Please updates its release PR using
    # GITHUB_TOKEN, and GitHub does not create workflow runs for events raised
    # by that token, so the release PR never picks up a fresh pull_request run.
    # Without this, a release could be cut against a stale check.
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    go-build-test:
        name: Go build, vet and test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Verify gofmt
              run: |
                  unformatted="$(gofmt -l .)"
                  if [ -n "$unformatted" ]; then
                      echo "These files need gofmt:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Verify go.mod is tidy
              run: |
                  go mod tidy
                  git diff --exit-code -- go.mod go.sum

            - name: Vet
              run: go vet ./...

            - name: Test
              run: go test -race -count=1 ./...

    golangci-lint:
        name: golangci-lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: latest

    docker-build:
        name: Docker build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build image (no push)
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile
                  push: false
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    renovate-config:
        name: Validate Renovate config
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # A malformed config does not fail visibly — Renovate logs it and
            # carries on doing nothing, which looks identical to "no updates".
            - name: Validate
              run: npx --yes -p renovate renovate-config-validator renovate.json

    helm-lint-template:
        name: Helm lint and template
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Helm
              uses: azure/setup-helm@v5

            - name: Lint chart
              run: helm lint ./charts/alertmanager-webhook-nagios-nrdp

            - name: Render chart (defaults)
              run: helm template nw ./charts/alertmanager-webhook-nagios-nrdp > /tmp/render-default.yaml

            - name: Render chart (nrdpToken + webhookAuth secrets)
              run: |
                  helm template nw ./charts/alertmanager-webhook-nagios-nrdp \
                    --set nrdpToken.existingSecret=nrdp-token \
                    --set webhookAuth.existingSecret=webhook-auth \
                    > /tmp/render-secrets.yaml
                  grep -q 'name: NRDP_TOKEN' /tmp/render-secrets.yaml
                  grep -q 'name: nrdp-token' /tmp/render-secrets.yaml
                  grep -q 'name: WEBHOOK_PASSWORD' /tmp/render-secrets.yaml

            - name: Render chart (TLS server + nrdp)
              run: |
                  helm template nw ./charts/alertmanager-webhook-nagios-nrdp \
                    --set tls.server.enabled=true --set tls.server.existingSecret=webhook-tls \
                    --set tls.nrdp.enabled=true --set tls.nrdp.existingSecret=nrdp-ca \
                    > /tmp/render-tls.yaml
                  grep -q 'scheme: HTTPS' /tmp/render-tls.yaml
                  grep -q 'secretName: webhook-tls' /tmp/render-tls.yaml
                  grep -q 'secretName: nrdp-ca' /tmp/render-tls.yaml

            - name: Render chart (service.port disagreeing with config's listen fails)
              run: |
                  if helm template nw ./charts/alertmanager-webhook-nagios-nrdp --set service.port=9090; then
                    echo "expected this render to fail: the container would listen on 8080 while the Service targets 9090" >&2
                    exit 1
                  fi
                  # Matching the two must still render.
                  cat > /tmp/port-values.yaml <<'EOF'
                  service:
                    port: 9090
                  config: |
                    server:
                      listen: ":9090"
                    nrdp:
                      url: https://nagios.example.com/nrdp/
                      token: t
                    rules:
                      - name: r
                        host: {template: "h"}
                        service: {template: "s"}
                  EOF
                  helm template nw ./charts/alertmanager-webhook-nagios-nrdp \
                    -f /tmp/port-values.yaml > /dev/null

            - name: Render chart (TLS enabled without existingSecret fails)
              run: |
                  if helm template nw ./charts/alertmanager-webhook-nagios-nrdp --set tls.server.enabled=true; then
                    echo "expected this render to fail without tls.server.existingSecret set" >&2
                    exit 1
                  fi

            - name: Render chart (PodDisruptionBudget + NetworkPolicy)
              run: |
                  helm template nw ./charts/alertmanager-webhook-nagios-nrdp \
                    --set podDisruptionBudget.enabled=true \
                    --set networkPolicy.enabled=true \
                    --set-json 'networkPolicy.ingress.from=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
                    > /tmp/render-guardrails.yaml
                  grep -q 'kind: PodDisruptionBudget' /tmp/render-guardrails.yaml
                  grep -q 'kind: NetworkPolicy' /tmp/render-guardrails.yaml
                  grep -q 'kubernetes.io/metadata.name: monitoring' /tmp/render-guardrails.yaml

            - name: Render chart (ServiceMonitor + PrometheusRule)
              run: |
                  helm template nw ./charts/alertmanager-webhook-nagios-nrdp \
                    --set serviceMonitor.enabled=true \
                    --set prometheusRule.enabled=true \
                    --set-json 'prometheusRule.labels={"release":"kube-prometheus-stack"}' \
                    > /tmp/render-observability.yaml
                  grep -q 'kind: ServiceMonitor' /tmp/render-observability.yaml
                  grep -q 'kind: PrometheusRule' /tmp/render-observability.yaml
                  grep -q 'alert: AlertmanagerWebhookNagiosNrdpDown' /tmp/render-observability.yaml
                  grep -q 'release: kube-prometheus-stack' /tmp/render-observability.yaml
                  # The alert-templating trick ({{ "{{ $labels.x }}" }}) must
                  # render literally, not get evaluated as a Helm variable.
                  grep -q '{{ $labels.instance }}' /tmp/render-observability.yaml
                  # The heartbeat alert is opt-in and must not appear by default.
                  if grep -q 'HeartbeatStale' /tmp/render-observability.yaml; then
                    echo "heartbeat alert should be opt-in, not rendered by default" >&2
                    exit 1
                  fi
                  helm template nw ./charts/alertmanager-webhook-nagios-nrdp \
                    --set prometheusRule.enabled=true \
                    --set prometheusRule.heartbeatAlert.enabled=true \
                    | grep -q 'AlertmanagerWebhookNagiosNrdpHeartbeatStale'
