name: E2E

# Builds the real binary and drives it as a subprocess against a fake NRDP
# HTTP endpoint - a real listener, a real POST of an Alertmanager payload,
# a real NRDP submission on the wire. There is no small, well-known
# "Nagios Core + NRDP" container image yet to test against a real Nagios;
# see e2e/e2e_test.go's package comment.
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run e2e suite
              run: go test -tags e2e -count=1 -run TestE2E -v ./e2e/...
